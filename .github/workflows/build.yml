name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build WhisperPolish.app
        run: |
          cd WhisperPolishApp
          ./build.sh
      
      - name: Create ZIP
        run: |
          cd WhisperPolishApp
          ditto -c -k --keepParent WhisperPolish.app WhisperPolish.app.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperPolish
          path: WhisperPolishApp/WhisperPolish.app.zip
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: WhisperPolishApp/WhisperPolish.app.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
